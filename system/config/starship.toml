add_newline = false
format = "$directory$git_branch$git_status$nodejs$python$rust$golang$cmd_duration$line_break$character"

[character]
success_symbol = "[›](bold yellow)"
error_symbol = "[›](bold red)"

[directory]
style = "bold cyan"
truncation_length = 3

[git_branch]
format = "[$branch]($style) "
style = "yellow"

[cmd_duration]
format = "[$duration]($style) "
style = "bright-black"
