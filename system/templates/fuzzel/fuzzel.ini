# Generated by memora-theme ({{name}}) — Spotlight-style launcher
[main]
font=JetBrainsMono Nerd Font:size=14
icon-theme={{icons}}
icons-enabled=yes
terminal=kitty -e
layer=overlay
anchor=top
y-margin=220
prompt="󰍉  "
placeholder=Search apps
width=46
lines=8
horizontal-pad=22
vertical-pad=18
inner-pad=12
line-height=30
image-size-ratio=0.5
match-mode=fzf
sort-result=yes
fields=name,generic,keywords

[colors]
background={{glass}}{{glass_alpha}}
text={{fg}}ff
prompt={{muted}}ff
placeholder={{muted}}ff
input={{fg}}ff
match={{accent2}}ff
selection={{accent2}}26
selection-text={{fg}}ff
selection-match={{accent2}}ff
border={{border_active}}

[border]
width=1
radius=20
