# Generated by memora-theme ({{name}})
general {
  hide_cursor = true
  ignore_empty_input = true
}

background {
  monitor =
  path = ~/.config/memora/current/wallpaper.png
  blur_passes = 3
  blur_size = 8
  noise = 0.012
  brightness = 0.85
  vibrancy = 0.2
}

label {
  monitor =
  text = cmd[update:60000] date +"%A, %d %B"
  color = rgba({{fg}}cc)
  font_size = 20
  font_family = JetBrainsMono Nerd Font
  position = 0, 330
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:30000] date +"%H:%M"
  color = rgb({{fg}})
  font_size = 120
  font_family = JetBrainsMono Nerd Font ExtraBold
  position = 0, 210
  halign = center
  valign = center
}

image {
  monitor =
  path = ~/.config/memora/current/logo.png
  size = 72
  rounding = -1
  border_size = 0
  position = 0, -120
  halign = center
  valign = center
}

label {
  monitor =
  text = $DESC
  color = rgb({{fg}})
  font_size = 15
  font_family = JetBrainsMono Nerd Font
  position = 0, -190
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 300, 48
  outline_thickness = 1
  dots_size = 0.2
  dots_spacing = 0.45
  dots_center = true
  outer_color = rgba({{border_active}})
  inner_color = rgba({{glass}}{{glass_alpha}})
  font_color = rgb({{fg}})
  font_family = JetBrainsMono Nerd Font
  check_color = rgba({{accent2}}aa)
  fail_color = rgb({{red}})
  placeholder_text = Enter password
  fail_text = Try again
  rounding = 24
  fade_on_empty = false
  position = 0, -260
  halign = center
  valign = center
}
